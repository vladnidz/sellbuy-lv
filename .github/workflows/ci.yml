name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sellbuy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sellbuy_test?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sellbuy_test?schema=shadow

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Create shadow database schema
        run: |
          psql postgresql://postgres:postgres@localhost:5432/sellbuy_test -c "CREATE SCHEMA IF NOT EXISTS shadow;"
          psql postgresql://postgres:postgres@localhost:5432/sellbuy_test -c "CREATE EXTENSION IF NOT EXISTS ltree;"

      - name: Check migrations are in sync with schema
        run: |
          ls -R prisma/migrations
          npx prisma migrate diff --exit-code --from-migrations prisma/migrations --to-schema prisma/schema.prisma

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
